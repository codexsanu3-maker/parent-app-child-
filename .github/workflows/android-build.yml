name: Build Family Safety APKs

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  android-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept SDK licenses
        run: yes | sdkmanager --licenses

      - name: Install SDK packages
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Run unit tests
        run: gradle --no-daemon :parent-app:testDebugUnitTest :child-app:testDebugUnitTest

      - name: Build APKs
        run: gradle --no-daemon :parent-app:assembleDebug :child-app:assembleDebug

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: family-safety-debug-apks
          path: |
            parent-app/build/outputs/apk/debug/*.apk
            child-app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
